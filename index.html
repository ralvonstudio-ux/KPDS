<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E6F1FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120E21" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Khatu Pixel Digital Studio — photography, videography, and customised gifts. Capturing moments, creating memories."
    />
    <title>Khatu Pixel Digital Studio</title>

    <!-- Set the theme class before React mounts so there's never a flash of
         the wrong theme. Mirrors the read/write logic in ThemeContext.
         Deliberately does NOT follow the OS's prefers-color-scheme — the
         reference design is Ivory/Navy/Coral on a light page, so every
         first-time visitor sees exactly that, regardless of their system
         theme. Dark mode is opt-in only, via the navbar toggle. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kpds-theme");
          document.documentElement.classList.toggle("dark", stored === "dark");
        } catch (e) {
          /* localStorage unavailable (privacy mode etc.) — light by default. */
        }
      })();
    </script>

    <!-- Boot loader — this is a client-rendered SPA (no SSR/SSG), so the
         page is otherwise blank white until the JS bundle finishes
         downloading, parsing, and mounting React. On a slow connection or
         device that can take several seconds; without this, that whole
         window looks broken rather than loading. Colors are hardcoded
         (not read from tokens.css) deliberately — this has to render
         before any stylesheet has loaded. Values match src/styles/tokens.css
         exactly; update both together if the palette changes.
         React's createRoot().render() (see src/main.tsx) replaces #root's
         entire contents on first render, so this disappears on its own —
         no cleanup code needed. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #e6f1fa 0%, #a7d8f2 100%);
      }
      html.dark #boot-loader {
        background: #120e21;
      }
      #boot-loader svg {
        animation: boot-spin 0.9s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader svg {
          animation: none;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Open Graph / social sharing. Image is a placeholder seed photo
         (matches the rest of the site's current stock imagery) — swap for
         a real studio photo once the client has one, and confirm the
         domain below once it's finalised (currently matches robots.txt's
         Sitemap line, itself a placeholder — see docs/design-system.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khatu Pixel Digital Studio" />
    <meta property="og:title" content="Khatu Pixel Digital Studio" />
    <meta
      property="og:description"
      content="Photography, videography, and customised gifts. Capturing moments, creating memories."
    />
    <meta property="og:image" content="https://khatupixel.studio/images/seed/kps-portrait-cover.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khatu Pixel Digital Studio" />
    <meta
      name="twitter:description"
      content="Photography, videography, and customised gifts. Capturing moments, creating memories."
    />
    <meta name="twitter:image" content="https://khatupixel.studio/images/seed/kps-portrait-cover.jpg" />
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#7c6af0" stroke-width="3" opacity="0.2" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="#7c6af0" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
